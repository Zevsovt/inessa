<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днем Рождения, Инесса!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- Плавающий милый фон (сердечки, блестки, лапки) -->
    <div class="floating-bg">
        <div class="float-item i-1">💖</div>
        <div class="float-item i-2">✨</div>
        <div class="float-item i-3">🌸</div>
        <div class="float-item i-4">🐾</div>
        <div class="float-item i-5">💖</div>
        <div class="float-item i-6">✨</div>
        <div class="float-item i-7">🌸</div>
        <div class="float-item i-8">🎀</div>
    </div>

    <!-- Фоновая музыка -->
    <audio id="bg-music" src="assets/bg.mp3" loop></audio>

    <!-- Экран 1: Приветствие -->
    <div id="screen-1" class="screen active">
        <div class="card">
            <h1>С днем рождения,<br>моя любимая Инесса! 💖</h1>
            <button onclick="startQuest()" class="btn">Начать сюрприз ✨</button>
        </div>
    </div>

    <!-- Экран 2: Ститч и Шарики -->
    <div id="screen-2" class="screen">
        <h2 class="hint">Лопни все шарики, в них секреты для тебя 🐾</h2>
        <div class="balloons-container" id="balloons-container"></div>
        <img src="assets/stitch.png" alt="Ститч" class="stitch-img">
        <button id="to-cake-btn" class="btn" onclick="goToCake()" style="display: none; margin-top: 25px;">К тортику 🎂</button>
    </div>

    <!-- Всплывающее окно для пожеланий -->
    <div id="wish-modal" class="modal hidden">
        <div class="modal-content">
            <p id="wish-text"></p>
            <button onclick="closeWish()" class="btn btn-small">Дальше ❤️</button>
        </div>
    </div>

    <!-- Экран 3: Тортик и Свечи -->
    <div id="screen-3" class="screen">
        <h1 class="sparkle-text" style="color: #ff6b81; font-family: 'Pacifico', cursive; margin-bottom: 30px;">Загадывай желание! 🎂</h1>
        <div class="cake-container">
            <img src="assets/cake.png" alt="Торт" class="cake-img">
            <div class="flame flame-1"></div>
            <div class="flame flame-2"></div>
        </div>
        <button id="blow-btn" onclick="blowCandles()" class="btn">Задуть свечи 💨</button>
    </div>

    <!-- Экран 4: Финал -->
    <div id="screen-4" class="screen">
        <div class="card final-card">
            <h1>Жду тебя у твоей общаги в 00:15 ⏰❤️</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
